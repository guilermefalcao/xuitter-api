# Configuração do banco de dados para TESTES
# Este arquivo é ativado quando @ActiveProfiles("test") é usado nos testes

# Nome da aplicação
spring.application.name=xuitter-api

# URL do banco de dados de TESTE
# xuitter_test - banco separado para não interferir nos dados de produção
# createDatabaseIfNotExist=true - Cria o banco automaticamente se não existir
spring.datasource.url=jdbc:mysql://localhost:3307/xuitter_test?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# Configurações JPA para testes
# ddl-auto=create-drop - Cria as tabelas ao iniciar e deleta ao finalizar o teste
# Isso garante que cada teste rode com banco limpo
spring.jpa.hibernate.ddl-auto=create-drop

# Desabilita Flyway nos testes (opcional)
# Como usamos create-drop, não precisamos das migrations
spring.flyway.enabled=false
